databases:
  - name: opusflow-db
    plan: free

services:
  - type: web
    name: opusflow-ai
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 4000
      - key: STORAGE_DIR
        value: /app/storage
      - key: DATABASE_URL
        fromDatabase:
          name: opusflow-db
          property: connectionString
    disk:
      name: opusflow-storage
      mountPath: /app/storage
      sizeGB: 1
